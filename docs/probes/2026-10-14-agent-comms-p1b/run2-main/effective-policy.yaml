Version:      1
Hash:         57c4fa02f134bf83ab0d94d5ba38befb9ca061f10d5130a8cd50df46858b0893
Status:       Effective
Source:       sandbox
Config rev:   11096242831913093415
---
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /home/sandbox
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  _provider_aos_claude_oauth:
    name: _provider_aos_claude_oauth
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/local/bin/node
      - path: /usr/bin/bash
  aos-bus:
    name: aos-bus
    endpoints:
      - host: host.docker.internal
        port: 8012
    binaries:
      - path: /**
  aos-services:
    name: aos-services
    endpoints:
      - host: '192.168.5.2'
        port: 8012
    binaries:
      - path: /**
  repo:
    name: repo
    endpoints:
      - host: pypi.org
        port: 443
      - host: files.pythonhosted.org
        port: 443
    binaries:
      - path: /**