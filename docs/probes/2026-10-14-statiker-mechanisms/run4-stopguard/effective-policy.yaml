Hash:         28ccc3373740c7b22a3828eccc160109f07667a755e5ae14843ec8bddb105405
Status:       Effective
Source:       sandbox
Config rev:   3824076826627059616
---
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /home/sandbox
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  _provider_aos_claude_oauth:
    name: _provider_aos_claude_oauth
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/local/bin/node
      - path: /usr/bin/bash
  aos-bus:
    name: aos-bus
    endpoints:
      - host: host.docker.internal
        port: 8013
    binaries:
      - path: /**
  harness:
    name: harness
    endpoints:
      - host: chatgpt.com
        port: 443
      - host: auth.openai.com
        port: 443
      - host: ab.chatgpt.com
        port: 443
    binaries:
      - path: /**
  repo:
    name: repo
    endpoints:
      - host: pypi.org
        port: 443
      - host: files.pythonhosted.org
        port: 443
    binaries:
      - path: /**